# Guardrails for AI-written code.
#
# Self-contained on purpose: it is copied into each repo by `vibe install`
# rather than being a reusable workflow. Reusable workflows across *private*
# repos on a personal account require each repo to explicitly grant Actions
# access, which is 47 settings pages. `vibe install --all` re-copies this file
# instead, which is one command.
#
# Budget: this is designed to finish in about a minute on a cold cache, because
# private-repo Actions minutes are metered and 47 repos share one allowance.
# Everything slow (full test suites, builds) belongs in the repo's own workflow.

name: guardrails

# Pull requests only. A push-to-main run would double the bill for the same
# commit, and GitHub rounds every job up to a whole minute.
on:
  pull_request:

# A new push supersedes the old run. Without this, a chatty agent pushing five
# times in ten minutes burns five times the minutes for one answer.
concurrency:
  group: guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every ${{ }} lives here, never inside a `run:` block. GitHub substitutes
    # expressions into the shell before it executes, so an interpolated field
    # that an outsider can influence is a command-injection hole. Referencing
    # "$BASE_SHA" instead passes it as data.
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan the commits the PR adds, not just
          # the final tree. Depth 0 on a small repo costs a second or two.
          fetch-depth: 0

      - name: Secrets in the diff
        # Scans only what this PR introduces. A pre-existing secret is a
        # separate (urgent) problem, but failing every PR on it helps nobody.
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          PATTERNS='AKIA[0-9A-Z]{16}|(ghp|gho|ghs|ghu)_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-ant-[A-Za-z0-9_-]{20,}|(sk|rk)_live_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|glpat-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git diff "$BASE...HEAD" -U0 -- . ':(exclude)*.example' ':(exclude)*.sample' \
              | grep -E '^\+' | grep -Ein "$PATTERNS"; then
            echo "::error::A credential appears in this diff. Rotate it, then remove it from the history."
            exit 1
          fi
          echo "no credentials in the diff"

      - name: Files that should never be committed
        # Fails on what THIS PR adds; warns about what was already there.
        #
        # Scanning the whole tree instead would mean a single pre-existing
        # tracked .pem fails every PR in the repo forever, with no way for any
        # contributor to make progress - a gate nobody can pass gets removed,
        # and then it protects nothing.
        run: |
          set -euo pipefail
          PATTERN='(^|/)(\.env(\.local)?|\.dev\.vars|id_rsa|.*\.pem|.*\.p12|.*\.keystore)$'
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            ADDED_FILES=$(git diff --name-only --diff-filter=A "$BASE_SHA...HEAD" || true)
          else
            ADDED_FILES=$(git ls-files)
          fi
          NEW_BAD=$(printf '%s\n' "$ADDED_FILES" | grep -Ei "$PATTERN" || true)
          if [ -n "$NEW_BAD" ]; then
            echo "::error::This PR adds files that must never be tracked:"; echo "$NEW_BAD"; exit 1
          fi
          OLD_BAD=$(git ls-files | grep -Ei "$PATTERN" || true)
          if [ -n "$OLD_BAD" ]; then
            echo "::warning::Already tracked and should not be (rotate the credential, then remove):"
            echo "$OLD_BAD"
          fi
          BIG=$(git ls-files -z | xargs -0 -r du -k 2>/dev/null | awk '$1 > 5120 {print $1"KB\t"$2}' || true)
          if [ -n "$BIG" ]; then
            echo "::warning::Large files tracked in git (consider LFS):"; echo "$BIG"
          fi
          echo "banned-file check: clean"

      - name: Tests that cannot fail
        # The cheapest possible check for the most common way AI-written code
        # fakes success: turning off the test instead of fixing the code.
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base to compare against; skipping"; exit 0
          fi
          ADDED=$(git diff "$BASE...HEAD" -U0 | grep -E '^\+' || true)
          FAIL=0
          if printf '%s' "$ADDED" | grep -Eq '(\bit|\bdescribe|\btest)\.(only|skip)\b|\bxit\(|\bxdescribe\(|@pytest\.mark\.skip|t\.Skip\(|#\[ignore\]'; then
            echo "::error::This PR adds a skipped or focused test. Fix the test or delete it; do not park it."
            FAIL=1
          fi
          if printf '%s' "$ADDED" | grep -Eq 'except\s*:\s*pass|except\s+Exception\s*:\s*pass|catch\s*\([^)]*\)\s*\{\s*\}|catch\s*\{\s*\}'; then
            echo "::error::This PR adds an empty exception handler. Handle the error or let it propagate."
            FAIL=1
          fi
          exit $FAIL

      - name: Workflow syntax
        run: |
          set -euo pipefail
          if ls .github/workflows/*.y*ml >/dev/null 2>&1; then
            # Fail OPEN if the tool cannot be fetched. `curl -fsSL` under
            # `set -e` made an unreachable raw.githubusercontent.com block
            # every PR in the repo - a linter outage is not a code defect.
            if ! curl -fsSL --max-time 30 -o /tmp/actionlint.bash \
                 https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash; then
              echo "::warning::could not fetch actionlint; skipping this check"
              exit 0
            fi
            bash /tmp/actionlint.bash >/dev/null 2>&1 || {
              echo "::warning::actionlint install failed; skipping this check"; exit 0; }
            ./actionlint -color
            echo "actionlint: clean"
          fi

      - name: Dependencies that do not exist
        # Slopsquatting: a model invents a plausible package name, someone
        # registers it, and the install pulls their code. Every newly added
        # dependency is checked against the registry before it can land.
        #
        # Parsed as JSON, not grepped out of the diff. A diff-grep treats npm
        # script names, keywords[] and files[] entries as package names, so it
        # reports invented dependencies that were never dependencies at all -
        # and a check that cries wolf gets switched off.
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then exit 0; fi
          if ! git diff --name-only "$BASE_SHA...HEAD" | grep -q 'package\.json$'; then exit 0; fi
          python3 - "$BASE_SHA" <<'PY'
          import json, subprocess, sys, urllib.error, urllib.parse, urllib.request

          base = sys.argv[1]
          DEP_KEYS = ("dependencies", "devDependencies", "optionalDependencies",
                      "peerDependencies")

          def deps_at(ref, path):
              try:
                  raw = subprocess.run(["git", "show", f"{ref}:{path}"],
                                       capture_output=True, text=True, check=True).stdout
                  data = json.loads(raw)
              except Exception:
                  return {}
              out = {}
              for key in DEP_KEYS:
                  section = data.get(key) or {}
                  if isinstance(section, dict):
                      out.update(section)
              return out

          files = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...HEAD"],
              capture_output=True, text=True, check=True).stdout.split()
          added = set()
          for path in files:
              if not path.endswith("package.json"):
                  continue
              before, after = deps_at(base, path), deps_at("HEAD", path)
              added |= {name for name in after if name not in before}

          if not added:
              print("no new dependencies")
              sys.exit(0)

          def registry(name):
              url = "https://registry.npmjs.org/" + urllib.parse.quote(name, safe="@")
              req = urllib.request.Request(url, headers={"User-Agent": "vibe-guardrails"})
              return json.load(urllib.request.urlopen(req, timeout=20))

          failed = False
          for name in sorted(added):
              try:
                  meta = registry(name)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print(f"::error::Dependency '{name}' does not exist on npm. It was invented.")
                      failed = True
                  else:
                      # Fail OPEN on anything that is not a definitive 404. A
                      # transient registry error must never be reported as
                      # "this package does not exist".
                      print(f"::warning::could not verify '{name}' (HTTP {exc.code}); skipping")
                  continue
              except Exception as exc:
                  print(f"::warning::could not verify '{name}' ({exc}); skipping")
                  continue
              print(f"verified: {name}")
          sys.exit(1 if failed else 0)
          PY
